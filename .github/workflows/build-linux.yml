name: SecureFox Linux experimental build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-linux.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout SecureFox
        uses: actions/checkout@v4

      - name: Inspect runner resources
        run: |
          df -h
          free -h

      - name: Checkout Firefox upstream
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: main
          path: firefox-source
          fetch-depth: 1
          persist-credentials: false

      - name: Apply SecureFox defaults
        run: python3 scripts/apply_source_defaults.py firefox-source/browser/app/profile/firefox.js

      - name: Prepare mozconfig
        run: |
          cat > firefox-source/mozconfig <<'MOZCONFIG'
          ac_add_options --enable-application=browser
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --enable-optimize
          MOZCONFIG

      - name: Bootstrap build dependencies
        working-directory: firefox-source
        run: ./mach bootstrap --application-choice browser

      - name: Build Firefox with SecureFox defaults
        working-directory: firefox-source
        env:
          MOZCONFIG: ${{ github.workspace }}/firefox-source/mozconfig
          MOZ_BUILD_JOBS: 2
        run: ./mach build

      - name: Package
        working-directory: firefox-source
        env:
          MOZCONFIG: ${{ github.workspace }}/firefox-source/mozconfig
        run: ./mach package

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: securefox-linux-experimental
          path: firefox-source/obj-*/dist/*.tar.*
          if-no-files-found: error
          retention-days: 7
